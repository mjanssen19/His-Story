[project]
name = "his-story"
version = "0.1.0"
description = "Turn your Foursquare Swarm check-in history into a searchable map and globe."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
his-story = "his_story.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["his_story"]
